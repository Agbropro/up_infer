app:
  name: UP Infer

server:
  # Use 127.0.0.1 for local access or 0.0.0.0 for network/domain access.
  domain: 0.0.0.0
  port: 7000
  reload: false

inference:
  # Process small batches to keep GPU memory predictable.
  batch_size: 1
  image_size: 640
  device: auto
  half: true
  clear_cache: true

# Paths may be absolute, project-relative, or an Ultralytics model name.
# Ultralytics downloads named models the first time they are selected.
models:
  - id: yolo11n
    name: YOLO 11 Nano Detection
    path: yolo11n.pt
  - id: yolo11n-seg
    name: YOLO 11 Nano Segmentation
    path: yolo11n-seg.pt
  - id: parkir_1_3_0
    name: parkir 1.3.0
    path: /mnt/secondary/tools/lpr-nba-tools/hasil_train_8jule/train/weights/best.pt
  - id: parkir_1_2_0
    name: parkir 1.2.0 
    path: /mnt/secondary/lpr-nba/models/plat_kendaraan/plat_kendaraan_1_2_0.pt

upload:
  max_files: 20
  max_mb: 15
